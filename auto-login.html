<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw 自动登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            color: #666;
            margin: 10px 0;
        }
        .success {
            color: #28a745;
            font-weight: bold;
        }
        .error {
            color: #dc3545;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦞 OpenClaw 自动登录</h1>
        <div class="spinner"></div>
        <p class="message" id="status">正在自动配置 Token...</p>
        <div id="successInfo" style="display: none; margin-top: 20px;">
            <p class="message success">✓ Token 已通过 URL 自动填写</p>
            <button onclick="copyAuthUrl()" style="margin-top: 10px;">📋 复制书签链接</button>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">
                提示：复制链接后添加为书签，下次可直接一键登录，无需重新输入token
            </p>
        </div>
        <button id="manualBtn" onclick="manualLogin()" style="display: none;">手动登录</button>
    </div>

    <script>
        const TOKEN = 'oc-authtok-a3f8c9d2e7b6f1a5c8d3e2f7a9b4c1d6e8f2a5b9c3d7e1a4f8b2c6d9e3a7f1b5c8';
        const GATEWAY_URL = 'http://localhost:9999';

        // 构建带token的完整URL
        function buildAuthUrl() {
            return `${GATEWAY_URL}?token=${encodeURIComponent(TOKEN)}`;
        }

        // 使用 URL 参数自动登录
        function autoLogin() {
            try {
                // 构建 URL，通过查询参数传递 token
                const loginUrl = buildAuthUrl();
                console.log('正在自动登录到:', loginUrl);
                document.getElementById('status').textContent = '正在跳转到带Token的URL...';
                document.getElementById('status').className = 'message success';

                // 显示成功信息和复制按钮
                setTimeout(() => {
                    document.querySelector('.spinner').style.display = 'none';
                    document.getElementById('successInfo').style.display = 'block';
                    document.getElementById('status').style.display = 'none';

                    // 跳转到带token的URL
                    setTimeout(() => {
                        window.location.href = loginUrl;
                    }, 3000); // 给用户3秒时间复制链接
                }, 1000);
            } catch (error) {
                console.error('自动登录失败:', error);
                document.getElementById('status').textContent = '自动登录失败，请手动登录';
                document.getElementById('status').className = 'message error';
                document.getElementById('manualBtn').style.display = 'inline-block';
            }
        }

        // 复制带token的URL到剪贴板
        function copyAuthUrl() {
            const authUrl = buildAuthUrl();
            navigator.clipboard.writeText(authUrl).then(() => {
                alert('带token的URL已复制到剪贴板！\n\n您可以将其添加为书签，这样就可以一键登录了。\n\nURL: ' + authUrl);
            }).catch(() => {
                prompt('请复制以下URL并添加为书签:', authUrl);
            });
        }

        // 手动登录
        function manualLogin() {
            window.location.href = GATEWAY_URL;
        }

        // 页面加载时执行
        window.onload = function() {
            console.log('正在自动登录...');
            autoLogin();
        };
    </script>
</body>
</html>
